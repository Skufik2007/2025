<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Приветствие</title></head>
<body>
  <h2>Введите ваше имя</h2>
  <form method="post">
    <input name="name" required>
    <button type="submit">Отправить</button>
  </form>
  {% if name %}
    <h1>Привет, {{ name }}!</h1>
  {% endif %}
</body>
</html>
