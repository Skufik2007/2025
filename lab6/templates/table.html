<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Студенты</title>
  <style>
    table { border-collapse: collapse; }
    td, th { border: 1px solid black; padding: 6px 12px; }
  </style>
</head>
<body>
  <h2>Список студентов</h2>
  <table>
    <tr><th>ФИО</th><th>Группа</th><th>Оценка</th></tr>
    {% for s in students %}
    <tr><td>{{ s.name }}</td><td>{{ s.group }}</td><td>{{ s.mark }}</td></tr>
    {% endfor %}
  </table>
</body>
</html>
